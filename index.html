// 去重（按题干+答案）
const seen = new Set();
const questions = [];
rawData.forEach((r, i) => {
  const [module, q, a, b, c, d, ans, exp] = r;
  const key = q + '||' + ans;
  if (seen.has(key)) return;
  seen.add(key);
  questions.push({ id: questions.length + 1, module: module || '综合', question: q, options: [a,b,c,d].map(x=>x||''), answer: ans.toUpperCase(), explanation: exp || '' });
});

// ========== 应用逻辑 ==========
let currentIndex = 0;
let userAnswers = new Array(questions.length).fill(null);
let answered = new Array(questions.length).fill(false);
let score = 0;
const appEl = document.getElementById('app');

function render() {
  if (currentIndex >= questions.length) { renderResult(); return; }
  const q = questions[currentIndex];
  const selected = userAnswers[currentIndex];
  const isAnswered = answered[currentIndex];

  let optionsHtml = '';
  q.options.forEach((opt, idx) => {
    const letter = String.fromCharCode(65 + idx);
    let cls = 'option';
    if (isAnswered) {
      cls += ' disabled';
      if (letter === q.answer) cls += ' correct';
      else if (selected === letter) cls += ' wrong';
    } else if (selected === letter) {
      cls += ' selected';
    }
    optionsHtml += `<div class="${cls}" data-letter="${letter}">
      <span class="option-letter">${letter}</span>
      <span class="option-text">${opt}</span>
    </div>`;
  });

  const expHtml = isAnswered ? `<div class="explanation show"><strong>📘 解析：</strong>${q.explanation || '略'}</div>` : `<div class="explanation"></div>`;
  const isLast = currentIndex === questions.length - 1;
  const nextText = isLast ? '完成挑战' : '下一题';

  appEl.innerHTML = `
    <h1>📚 采购技委 <small>${questions.length}题</small></h1>
    <div class="subhead">
      <span>轻松刷题 · 微信分享</span>
      <span class="progress-badge">${currentIndex + 1} / ${questions.length}</span>
    </div>
    <div class="card">
      <div class="question-meta">
        <span class="module-tag">${q.module}</span>
        <span class="type-tag">单选题</span>
      </div>
      <div class="question-text">${q.question}</div>
      <div class="options" id="optionsContainer">${optionsHtml}</div>
      ${expHtml}
      <div class="action-bar">
        <button class="btn btn-secondary" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>上一题</button>
        <button class="btn btn-primary" id="nextBtn" ${!isAnswered ? 'disabled' : ''}>${nextText}</button>
      </div>
      <div class="badge-nav">
        <span class="question-index">第 ${currentIndex + 1} 题</span>
        <span style="font-size:.75rem;color:#94a3b8;">点击选项即可查看解析</span>
      </div>
    </div>
    <div class="note">✨ 共 ${questions.length} 题，刷完查看成绩</div>
  `;

  document.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', () => {
      if (answered[currentIndex]) return;
      const letter = el.dataset.letter;
      userAnswers[currentIndex] = letter;
      answered[currentIndex] = true;
      if (letter === q.answer) score++;
      render();
    });
  });

  document.getElementById('prevBtn')?.addEventListener('click', () => {
    if (currentIndex > 0) { currentIndex--; render(); }
  });
  document.getElementById('nextBtn')?.addEventListener('click', () => {
    if (currentIndex < questions.length - 1) { currentIndex++; render(); }
    else { renderResult(); }
  });
}

function renderResult() {
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  let comment = pct >= 90 ? '🏆 太强了，采购专家！' : pct >= 75 ? '👍 不错哦，再巩固一下' : pct >= 60 ? '📖 及格啦，继续加油' : '💪 别灰心，多刷几遍';
  appEl.innerHTML = `
    <div class="result-screen">
      <h1 style="justify-content:center;">🎉 挑战完成</h1>
      <div class="score-big">${score} <span style="font-size:1.8rem;color:#94a3b8;">/ ${total}</span></div>
      <div class="score-sub">${comment}</div>
      <div class="result-stats">
        <div class="stat-item"><span class="stat-num" style="color:#10b981;">${score}</span><span class="stat-label">正确</span></div>
        <div class="stat-item"><span class="stat-num" style="color:#ef4444;">${total - score}</span><span class="stat-label">错误</span></div>
        <div class="stat-item"><span class="stat-num" style="color:#4f46e5;">${pct}%</span><span class="stat-label">正确率</span></div>
      </div>
      <div class="finish-actions">
        <button class="btn btn-secondary" id="restartBtn">重新刷题</button>
        <button class="btn btn-primary" id="shareBtn">分享给朋友</button>
      </div>
      <div class="note" style="margin-top:20px;">点击分享可复制文案发给微信好友</div>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', () => {
    currentIndex = 0; userAnswers.fill(null); answered.fill(false); score = 0; render();
  });
  document.getElementById('shareBtn').addEventListener('click', () => {
    const text = `我在「采购技委刷题」中答对了 ${score}/${total} 题，正确率 ${pct}%！你也来试试吧～`;
    if (navigator.share) {
      navigator.share({ title: '采购技委刷题', text }).catch(()=>{});
    } else {
      navigator.clipboard.writeText(text).then(()=>alert('分享文案已复制，去微信粘贴给朋友吧！')).catch(()=>alert('请手动复制：'+text));
    }
  });
}

render();
</script>
